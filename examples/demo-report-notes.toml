task = "Проверить локальное окружение на функции double lab_abs(double x) в ANSI C89 и сравнить стоимость получения проверенного решения при кратком и подробном промптах. Проверяется один исходник solution.c без main, заголовков и библиотечных вызовов. Компонент ACOM в этой демонстрации не создаётся."
algorithm = "В принятых реализациях значение, равное нулю, отдельно преобразуется в литерал 0.0. Для остальных значений функция проверяет знак и при необходимости меняет его. Это даёт положительный ноль для обоих знаков входного нуля. Исходники каждого варианта сохранены в workspace соответствующего запуска."
complexity = "Для конечных входных значений выполняется постоянное число сравнений и арифметических операций. Временная сложность O(1), дополнительная память O(1); динамической памяти нет."
improvements = "Краткий промпт породил реализацию, сохраняющую отрицательный ноль. После шести неуспешных автоматических проверок каждому из трёх кратких запусков через resume передано одно заранее подготовленное английское уточнение из correction.txt и добавлены три разрешённых запроса. Подробный английский промпт содержал эту алгоритмическую подсказку с самого начала. Оба подхода в итоге прошли проверки; все прежние затраты кратких запусков сохранены."
testing = "Компилятор Clang запускался с -std=c89 -pedantic-errors -Wall -Wextra -Werror. Независимый клиент проверил 10 случаев: +0.0, -0.0, ±1.0, ±1.25, ±1e-200 и ±1e200. Итоговые шесть решений прошли все проверки. Для нулей дополнительно проверялся положительный знак. Скрининг запрещённых библиотечных вызовов регулярным выражением не является полным анализом C. NaN, бесконечности и время выполнения самого алгоритма в этой демонстрации не исследовались."
integration = "Эта функция проверяет работу агента, компилятора и измерений. Для лабораторной ACOM нужны настоящий Eco SDK, интерфейсы, IID/CID, фабрика, управление ссылками и консольный клиент. Их необходимо передать в исходном проекте и проверить отдельными командами; данная демонстрация не подтверждает соответствие ACOM."
visualization = "Численные метрики сравниваются в таблице. CSV и JSON доступны для построения собственных графиков. Отдельная визуализация математического алгоритма в этой демонстрации не создавалась."
conclusion = "При одинаковой модели и seed=42 проведены три пары с чередованием порядка. Подробным запускам потребовался один запрос без уточнений; кратким — семь запросов и одно подготовленное уточнение. Первоначальные результаты до resume отдельно сохранены в reports/demo-initial: краткие варианты исчерпали бюджет, подробные прошли проверку. Итоговая таблица учитывает весь путь до рабочего решения. Для кратких вариантов бюджет был увеличен с шести до девяти запросов, поэтому отчёт отмечает различие конфигураций. Это демонстрация конкретного задания и влияния содержания инструкции; она не доказывает общее превосходство длинных промптов. Фиксированный seed приводит к совпадению ответов и объёма токенов; разброс времени отражает измерения этого Mac."
